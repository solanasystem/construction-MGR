<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async function(){
  const $ = id => document.getElementById(id);
  const TYPE = { report:'報告', contact:'連絡', consult:'相談' };
  const TYPESUB = { report:'成果・進み具合', contact:'問題点', consult:'重要・遅れ直結' };
  const STATUS = { open:'未対応', in_progress:'対応中', resolved:'解決' };

  // 並べ替え（Excel風：列見出しをタップで昇順/降順）。既定は日時の新しい順。
  let sortKey = 'date', sortDir = -1;
  try { const s = JSON.parse(localStorage.getItem('hrs_sort') || 'null'); if (s && s.k){ sortKey = s.k; sortDir = (s.d === 1 ? 1 : -1); } } catch(e){}
  const SKN = { type:'種別', title:'見出し・内容', project:'工事', author:'投稿者', date:'日時', status:'状態', ack:'本社確認' };
  const TORD = { report:0, contact:1, consult:2 };
  const SORD = { open:0, in_progress:1, resolved:2 };
  const fmtDT = ts => { if(!ts) return ''; const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
    return `${String(d.getFullYear()).slice(2)}/${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
  const dayKey = ts => { const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
  const BUCKET = 'project-files';
  const fmtSize = b => b>=1048576 ? (b/1048576).toFixed(1)+'MB' : b>=1024 ? Math.round(b/1024)+'KB' : (b||0)+'B';
  function fileIcon(name, mime){ const s=((mime||'')+' '+(name||'')).toLowerCase();
    if (/image|\.(jpg|jpeg|png|gif|webp|heic|bmp)/.test(s)) return '🖼';
    if (/pdf/.test(s)) return '📄';
    if (/word|\.docx?(\s|$)/.test(s)) return '📝';
    if (/sheet|excel|\.xlsx?(\s|$)|\.csv(\s|$)/.test(s)) return '📊';
    if (/\.pptx?(\s|$)|powerpoint|presentation/.test(s)) return '📽';
    return '📎'; }
  async function openFile(path){
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
    if (error || !data){ showMsg($('msg'),'ファイルを開けませんでした。','err'); return; }
    window.open(data.signedUrl, '_blank');
  }

  const auth = await requireAuth();
  if (!auth) return;
  const me = auth.me;
  const isMgr = (me.role === 'admin' || me.role === 'manager');   // 経営者(①)・現場監督(②)＝本ページの利用者
  // 権限：報・連・相は「経営者 ⇄ 現場監督」の間だけ。一般社員・外注社員・協力業者は使用不可。
  if (!isMgr){ alert('報・連・相は経営者・現場監督のみ使用できます。'); location.replace('mode-select.html'); return; }
  paintBar(me, await loadOrgName(me.organization_id));

  const HELPKEY = 'hrs_help_open';
  function applyHelp(){ let o=false; try{o=localStorage.getItem(HELPKEY)==='1';}catch(e){} $('lead').hidden=!o; $('helpBtn').textContent=o?'？使い方 ▲':'？使い方 ▼'; }
  $('helpBtn').addEventListener('click', ()=>{ let o=false; try{o=localStorage.getItem(HELPKEY)==='1';}catch(e){} try{localStorage.setItem(HELPKEY,o?'0':'1');}catch(e){} applyHelp(); });
  applyHelp();

  let projects = [], users = [], reports = [], replies = [], atts = [];
  let picked = [];   // 新規投稿で選択中の添付ファイル（ドラッグ／選択）
  const qs = new URL(location.href).searchParams;
  let projId = qs.get('p') || '';

  async function loadRefs(){
    const [pj, us] = await Promise.all([
      sb.from('projects').select('id, project_no, name').eq('is_active', true).order('project_no'),
      sb.from('app_users').select('id, name').eq('is_active', true),
    ]);
    projects = pj.data || []; users = us.data || [];
    const opts = '<option value="">工事全体</option>' + projects.map(p=>`<option value="${p.id}">${esc(p.project_no||'')} ${esc(p.name)}</option>`).join('');
    $('n_proj').innerHTML = opts;
    $('fproj').innerHTML = '<option value="">すべての工事</option>' + projects.map(p=>`<option value="${p.id}"${p.id===projId?' selected':''}>${esc(p.project_no||'')} ${esc(p.name)}</option>`).join('');
  }

  async function loadData(){
    let rq = sb.from('site_reports').select('*').eq('is_active', true).order('created_at', { ascending:false });
    if (projId) rq = rq.eq('project_id', projId);
    const r = await rq;
    if (r.error){
      showMsg($('msg'), /relation .* does not exist|schema cache/i.test(r.error.message||'')
        ? 'データベースに報・連・相の表がまだありません。Supabase で phase22_hourensou.sql を実行してください。'
        : '読み込めませんでした。' + r.error.message, 'err');
      reports = []; replies = []; return;
    }
    reports = r.data || [];
    const ids = reports.map(x=>x.id);
    if (ids.length){
      const [rr, ff] = await Promise.all([
        sb.from('site_report_replies').select('*').in('report_id', ids).order('created_at'),
        sb.from('project_files').select('id,site_report_id,storage_path,original_name,mime_type,byte_size')
          .in('site_report_id', ids)
      ]);
      replies = rr.data || [];
      atts = ff.error ? [] : (ff.data || []);   // 添付列(site_report_id)未作成でも壊れないように
    } else { replies = []; atts = []; }
  }
  const attsOf = id => atts.filter(a=>a.site_report_id===id);

  const umap = () => Object.fromEntries(users.map(u=>[u.id,u.name]));
  const projmap = () => Object.fromEntries(projects.map(p=>[p.id,p]));
  const repliesOf = id => replies.filter(r=>r.report_id===id);

  function render(){
    const UM = umap(), PJ = projmap();
    const ft = $('ftype').value, fs = $('fstatus').value, q = ($('q').value||'').trim().toLowerCase();
    const tkey = todayStr();

    // サマリ（現在の絞り込み工事の範囲で）
    const nConsult = reports.filter(r=>r.report_type==='consult' && r.status!=='resolved').length;
    const nContact = reports.filter(r=>r.report_type==='contact' && r.status!=='resolved').length;
    const nUnack   = reports.filter(r=>!r.acknowledged_at).length;
    const nToday   = reports.filter(r=>dayKey(r.created_at)===tkey).length;
    $('sumgrid').hidden = false;
    $('sumgrid').innerHTML =
      `<div class="sumcard ${nConsult>0?'danger':'ok'}"><span class="ico">${nConsult>0?'🔴':'✓'}</span><span class="t">未解決の相談</span><span class="v">${nConsult}<small>件</small></span></div>`
    + `<div class="sumcard ${nContact>0?'warn':'ok'}"><span class="ico">${nContact>0?'⚠':'✓'}</span><span class="t">未解決の問題点</span><span class="v">${nContact}<small>件</small></span></div>`
    + `<div class="sumcard info"><span class="ico">📥</span><span class="t">本社未確認</span><span class="v">${nUnack}<small>件</small></span></div>`
    + `<div class="sumcard info"><span class="ico">📅</span><span class="t">今日の投稿</span><span class="v">${nToday}<small>件</small></span></div>`;

    let rows = reports.slice();
    if (ft) rows = rows.filter(r=>r.report_type===ft);
    if (fs==='unres') rows = rows.filter(r=>r.status!=='resolved');
    else if (fs==='unack') rows = rows.filter(r=>!r.acknowledged_at);
    else if (fs==='mine') rows = rows.filter(r=>r.created_by===me.id);
    if (q) rows = rows.filter(r=>((r.title||'')+' '+(r.body||'')).toLowerCase().includes(q));

    // 並べ替え（Excel風）：選んだ列で昇順/降順。既定は日時の新しい順。
    const jc = (a,b) => String(a==null?'':a).localeCompare(String(b==null?'':b), 'ja', { numeric:true });
    const cmps = {
      type:    (a,b)=> ((TORD[a.report_type]??9)-(TORD[b.report_type]??9)) || jc(b.created_at,a.created_at),
      title:   (a,b)=> jc(a.title, b.title),
      project: (a,b)=> jc((PJ[a.project_id]||{}).name, (PJ[b.project_id]||{}).name) || jc(b.created_at,a.created_at),
      author:  (a,b)=> jc(UM[a.created_by], UM[b.created_by]) || jc(b.created_at,a.created_at),
      date:    (a,b)=> jc(a.created_at, b.created_at),
      status:  (a,b)=> ((SORD[a.status]??9)-(SORD[b.status]??9)) || jc(b.created_at,a.created_at),
      ack:     (a,b)=> ((a.acknowledged_at?1:0)-(b.acknowledged_at?1:0)) || jc(b.created_at,a.created_at),
    };
    const cmp = cmps[sortKey] || cmps.date;
    rows.sort((a,b)=> cmp(a,b) * sortDir);

    if (!rows.length){
      $('stable').innerHTML = `<div class="empty"><b>該当する投稿がありません</b>右上の「投稿する」から報告・連絡・相談を記録できます。</div>`;
      return;
    }

    const arrow = k => sortKey===k ? (sortDir===1?'▲':'▼') : '';
    const th = (k,label) => `<span class="sh${sortKey===k?' on':''}" data-sort="${k}" role="button" tabindex="0" aria-label="${label}で並べ替え">${label}<i class="ar">${arrow(k)}</i></span>`;
    let h = `<div class="stable"><div class="shead">`
      + `<span class="rno">NO</span>${th('type','種別')}${th('title','見出し・内容')}${th('project','工事')}${th('author','投稿者')}${th('date','日時')}${th('status','状態')}${th('ack','本社確認')}</div>`;
    rows.forEach((r,i)=>{
      const pj = PJ[r.project_id];
      const consultUnres = r.report_type==='consult' && r.status!=='resolved';
      const contactUnres = r.report_type==='contact' && r.status!=='resolved';
      const cls = consultUnres ? 'consultUnres' : (contactUnres ? 'unres' : '');
      const nrep = repliesOf(r.id).length;
      const natt = attsOf(r.id).length;
      h += `<div class="srow ${cls}" data-id="${r.id}">
        <span class="rno"><b class="mlbl">No. </b>${i+1}</span>
        <span class="ctr"><span class="tchip ${r.report_type}">${TYPE[r.report_type]}</span></span>
        <span><span class="ttl">${esc(r.title||'（無題）')}</span><span class="ex">${esc((r.body||'').replace(/\s+/g,' '))}${natt?`　📎${natt}`:''}${nrep?`　💬${nrep}`:''}</span></span>
        <span class="ctr"><span class="sub">${pj?esc(pj.name):'工事全体'}</span></span>
        <span class="ctr"><span class="sub">${UM[r.created_by]?esc(UM[r.created_by]):'—'}</span></span>
        <span class="num">${fmtDT(r.created_at)}</span>
        <span class="ctr">${r.report_type==='report'?'<span class="sub">—</span>':`<span class="schip ${r.status}">${STATUS[r.status]||''}</span>`}</span>
        <span class="ctr"><span class="ackchip ${r.acknowledged_at?'yes':'no'}">${r.acknowledged_at?'確認済':'未確認'}</span></span>
      </div>`;
    });
    h += `</div>`;
    $('stable').innerHTML = h;
    $('stable').querySelectorAll('.shead .sh').forEach(el => {
      const doSort = () => {
        const k = el.dataset.sort;
        if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = (k==='date') ? -1 : 1; }
        try { localStorage.setItem('hrs_sort', JSON.stringify({ k:sortKey, d:sortDir })); } catch(e){}
        render();
      };
      el.addEventListener('click', doSort);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); doSort(); } });
    });
    $('stable').querySelectorAll('.srow').forEach(el=> el.addEventListener('click', ()=> openDetail(el.dataset.id)));
  }

  /* ===== 新規投稿 ===== */
  let nType = 'report';
  $('newbtn').addEventListener('click', ()=>{
    nType='report'; $('nseg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.t==='report'));
    $('n_proj').value = projId || ''; $('n_title').value=''; $('n_body').value=''; showMsg($('nmsg'),'');
    picked = []; renderPicked();
    $('npanel').classList.add('open'); $('n_title').focus();
  });
  $('nseg').querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ nType=b.dataset.t; $('nseg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));

  // 添付：ドラッグ＆ドロップ＋ファイル選択
  function renderPicked(){
    $('n_flist').innerHTML = picked.map((f,i)=>{
      const sizeHtml = f.busy
        ? `<span class="fs">圧縮中…</span>`
        : (f.compressed
            ? `<span class="fs">${fmtSize(f.origSize)} → ${fmtSize(f.size)} <b style="color:var(--ok)">画像圧縮済</b></span>`
            : `<span class="fs">${fmtSize(f.size)}</span>`);
      return `<div class="fitem">${fileIcon(f.name,f.type)} <span class="fn">${esc(f.name)}</span> ${sizeHtml} <button type="button" class="rm" data-i="${i}" title="外す">×</button></div>`;
    }).join('');
    $('n_flist').querySelectorAll('.rm').forEach(b=> b.addEventListener('click', ()=>{ picked.splice(+b.dataset.i,1); renderPicked(); }));
  }
  // 選んだ瞬間に画像を圧縮（1600px・JPEG）。圧縮後サイズを表示する。
  async function addFiles(list){
    const arr = Array.from(list || []).filter(Boolean);
    const entries = arr.map(f => ({ name:f.name, type:f.type||'', blob:f, origSize:f.size, size:f.size, compressed:false, busy:(f.type||'').startsWith('image/') }));
    entries.forEach(e => picked.push(e));
    renderPicked();
    for (const e of entries){
      if (!e.busy) continue;
      try {
        const shrunk = await shrinkImage(e.blob, 1600, 0.8);
        if (shrunk && shrunk.blob && shrunk.blob.size < e.origSize){
          e.blob = shrunk.blob; e.type = 'image/jpeg'; e.size = shrunk.blob.size; e.compressed = true;
        }
      } catch(err){ console.error(err); }
      e.busy = false;
      renderPicked();
    }
  }
  $('n_pick').addEventListener('click', ()=> $('n_files').click());
  $('n_files').addEventListener('change', ()=>{ addFiles($('n_files').files); $('n_files').value=''; });
  const dz = $('n_drop');
  ['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.add('drag'); }));
  ['dragleave','dragend'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.remove('drag'); if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  $('npanel').addEventListener('dragover', e=> e.preventDefault());
  $('npanel').addEventListener('drop', e=> e.preventDefault());
  $('ncancel').addEventListener('click', ()=> $('npanel').classList.remove('open'));
  $('nsave').addEventListener('click', async ()=>{
    const title = $('n_title').value.trim(), body = $('n_body').value.trim();
    if (!title && !body){ showMsg($('nmsg'),'見出しか内容を入れてください。','err'); return; }
    $('nsave').disabled=true; $('nsave').textContent='投稿中…';
    const proj = $('n_proj').value || null;
    const { data:ins, error } = await sb.from('site_reports').insert({
      organization_id: me.organization_id, project_id: proj,
      report_type: nType, title: title || null, body: body || null,
      status: 'open', created_by: me.id
    }).select('id').single();
    if (error){ $('nsave').disabled=false; $('nsave').textContent='投稿する'; showMsg($('nmsg'),'投稿できませんでした。'+error.message,'err'); return; }
    const rid = ins.id;
    // 添付をアップロード（画像は選択時に圧縮済み。その entry の blob をそのまま送る）
    // ストレージのパスは「<組織ID>/…」で始める必要がある（バケットのポリシー準拠）。
    let attErr = 0;
    for (let k=0;k<picked.length;k++){
      const it = picked[k];
      $('nsave').textContent = `添付をアップロード中… ${k+1}/${picked.length}`;
      try {
        const blob = it.blob;
        const ctype = it.type || 'application/octet-stream';
        const safe = (it.name||'file').replace(/[^\w.\-]+/g,'_');
        const path = `${me.organization_id}/reports/${rid}/${Date.now()}_${k}_${safe}${it.compressed?'.jpg':''}`;
        const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: ctype });
        if (up.error) throw up.error;
        const ins2 = await sb.from('project_files').insert({
          organization_id: me.organization_id, project_id: proj,
          uploaded_by: me.id,
          file_kind: (it.type||'').startsWith('image/') ? 'photo' : ((it.type==='application/pdf') ? 'document' : 'other'),
          storage_path: path, original_name: it.name, mime_type: it.type || null,
          byte_size: blob.size, site_report_id: rid
        });
        if (ins2.error) throw ins2.error;
      } catch(e){ console.error(e); attErr++; showMsg($('nmsg'), `添付「${it.name}」を保存できませんでした：${(e && e.message) || e}`, 'err'); }
    }
    $('nsave').disabled=false; $('nsave').textContent='投稿する';
    $('npanel').classList.remove('open');   // 投稿は保存済み。重複投稿を防ぐため必ず閉じる
    await loadData(); render();
    if (attErr > 0) showMsg($('msg'), `投稿は保存しましたが、添付${attErr}件を保存できませんでした（ストレージ設定をご確認ください。詳細はブラウザのコンソール）。`, 'err');
  });

  /* ===== 詳細・返信・本社確認・状態変更 ===== */
  let dId = null;
  async function openDetail(id){
    dId = id;
    const r = reports.find(x=>x.id===id); if(!r) return;
    const UM = umap(), PJ = projmap(); const pj = PJ[r.project_id];
    $('dttl').innerHTML = `<span class="tchip ${r.report_type}">${TYPE[r.report_type]}</span> ${esc(r.title||'（無題）')}`;
    const reps = repliesOf(id);
    const myatts = attsOf(id);
    const attHtml = myatts.length
      ? `<div style="font-size:12px;font-weight:800;color:var(--ink-2);margin-top:6px">添付（${myatts.length}）</div>`
        + `<div class="atts">${myatts.map(a=>`<button type="button" class="attitem" data-path="${esc(a.storage_path)}">${fileIcon(a.original_name,a.mime_type)} <span class="an">${esc(a.original_name||'ファイル')}</span> <span class="asz">${fmtSize(a.byte_size)}</span></button>`).join('')}</div>`
      : '';
    const statSel = (r.report_type!=='report' && isMgr)
      ? `<div class="frow"><label>状態</label><select id="d_status">
           ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${r.status===k?' selected':''}>${v}</option>`).join('')}
         </select></div>` : '';
    const ackBtn = isMgr
      ? (r.acknowledged_at ? `<span class="ackchip yes">確認済（${UM[r.acknowledged_by]?esc(UM[r.acknowledged_by]):''} ${fmtDT(r.acknowledged_at)}）</span>`
                           : `<button class="btn sm" id="d_ack" type="button">本社として確認</button>`)
      : `<span class="ackchip ${r.acknowledged_at?'yes':'no'}">${r.acknowledged_at?'本社確認済':'本社未確認'}</span>`;
    // 報告・連絡・相談は全ログ保存が前提。削除機能は設けない。

    $('dbodywrap').innerHTML =
      `<div class="dmeta">${pj?esc(pj.name):'工事全体'}　｜　投稿：${UM[r.created_by]?esc(UM[r.created_by]):'—'}　${fmtDT(r.created_at)}　｜　${TYPESUB[r.report_type]}</div>`
    + `<div class="dbody">${esc(r.body||'')||'<span style=\"color:var(--sub)\">（本文なし）</span>'}</div>`
    + attHtml
    + statSel
    + `<div class="cfoot">${ackBtn}</div>`
    + `<div style="font-size:12px;font-weight:800;color:var(--ink-2);margin-top:6px">やり取り（${reps.length}）</div>`
    + `<div class="replies" id="d_replies">${reps.map(x=>`<div class="reply"><div class="rmeta">${UM[x.created_by]?esc(UM[x.created_by]):'—'}　${fmtDT(x.created_at)}</div><div class="rtext">${esc(x.body||'')}</div></div>`).join('') || '<span class="sub" style="font-size:12px;color:var(--sub)">まだ返信はありません。</span>'}</div>`
    + `<textarea id="d_reply" placeholder="返信を書く（本社の回答・現場の追記）"></textarea>`
    + `<div class="cfoot"><span style="flex:1 1 auto"></span><button class="btn ghost sm" id="d_close" type="button">閉じる</button><button class="btn sm" id="d_send" type="button">返信する</button></div>`;

    $('dpanel').classList.add('open');
    $('dbodywrap').querySelectorAll('.attitem').forEach(b=> b.addEventListener('click', ()=> openFile(b.dataset.path)));
    $('d_close').addEventListener('click', ()=> $('dpanel').classList.remove('open'));
    const send = $('d_send'); if (send) send.addEventListener('click', sendReply);
    const ack = $('d_ack'); if (ack) ack.addEventListener('click', doAck);
    const ss = $('d_status'); if (ss) ss.addEventListener('change', ()=> changeStatus(ss.value));
  }

  async function sendReply(){
    const body = $('d_reply').value.trim(); if(!body) return;
    $('d_send').disabled=true;
    const { error } = await sb.from('site_report_replies').insert({
      organization_id: me.organization_id, report_id: dId, body, created_by: me.id });
    $('d_send').disabled=false;
    if (error){ showMsg($('msg'),'返信できませんでした。'+error.message,'err'); return; }
    await loadData(); render(); openDetail(dId);
  }
  async function doAck(){
    const { error } = await sb.from('site_reports').update({ acknowledged_by: me.id, acknowledged_at: new Date().toISOString() }).eq('id', dId);
    if (error){ showMsg($('msg'),'確認できませんでした。'+error.message,'err'); return; }
    await loadData(); render(); openDetail(dId);
  }
  async function changeStatus(v){
    const { error } = await sb.from('site_reports').update({ status: v }).eq('id', dId);
    if (error){ showMsg($('msg'),'状態を変えられませんでした。'+error.message,'err'); return; }
    await loadData(); render(); openDetail(dId);
  }

  // イベント
  $('fproj').addEventListener('change', async ()=>{
    projId = $('fproj').value;
    const u = new URL(location.href); projId ? u.searchParams.set('p', projId) : u.searchParams.delete('p'); history.replaceState(null,'',u);
    await loadData(); render();
  });
  $('ftype').addEventListener('change', render);
  $('fstatus').addEventListener('change', render);
  $('q').addEventListener('input', render);
  [$('npanel'),$('dpanel')].forEach(p=> p.addEventListener('click', e=>{ if(e.target===p) p.classList.remove('open'); }));

  await loadRefs();
  await loadData();
  render();
})();
</script>
</body>
</html>
